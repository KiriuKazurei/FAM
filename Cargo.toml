[workspace]
resolver = "2"
members = [
    "crates/fam-core",
    "crates/fam-svc-store",
    "crates/fam-svc-enumerate",
    "crates/fam-svc-index",
    "crates/fam-svc-everything",
    "crates/fam-svc-walk",
    "crates/fam-sched",
    "crates/fam-view",
    "crates/fam-ffi",
    "crates/fam-bench",
    "apps/fam-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
fam-core = { path = "crates/fam-core" }
fam-svc-store = { path = "crates/fam-svc-store" }
fam-svc-enumerate = { path = "crates/fam-svc-enumerate" }
fam-svc-index = { path = "crates/fam-svc-index" }
fam-svc-everything = { path = "crates/fam-svc-everything" }
fam-svc-walk = { path = "crates/fam-svc-walk" }
fam-sched = { path = "crates/fam-sched" }
fam-view = { path = "crates/fam-view" }
fam-ffi = { path = "crates/fam-ffi" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = "0.11"
log = "0.4"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
codegen-units = 16
